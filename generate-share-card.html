<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>生成分享卡片</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; text-align: center; padding: 40px; }
  canvas { border: 1px solid #eee; border-radius: 8px; max-width: 90vw; }
  button { margin-top: 16px; padding: 12px 32px; font-size: 16px; background: #81C784; color: white; border: none; border-radius: 12px; cursor: pointer; }
  p { color: #666; margin-top: 8px; }
</style>
</head>
<body>
<h2>分享卡片预览</h2>
<canvas id="c"></canvas>
<p>点击下载 → 上传到托管平台根目录，命名为 <code>share-card.png</code></p>
<button id="dl-btn" onclick="download()" disabled>加载中…</button>
<script>
const W = 1200, H = 1600;
const canvas = document.getElementById('c');
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext('2d');

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

function draw(qrImg) {
  // BG
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#E8F5E9'); g.addColorStop(0.4,'#FFF9C4'); g.addColorStop(1,'#FFFDE7');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // Decos
  ctx.globalAlpha=0.12;
  [{x:160,y:360,r:200,c:'#81C784'},{x:960,y:280,r:140,c:'#A5D6A7'},{x:1040,y:1120,r:260,c:'#FFE082'},{x:200,y:1240,r:120,c:'#81C784'}].forEach(d=>{ctx.fillStyle=d.c;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;

  // White card
  ctx.fillStyle='#FFF';ctx.shadowColor='rgba(0,0,0,.08)';ctx.shadowBlur=80;ctx.shadowOffsetY=12;rr(ctx,90,240,W-180,H-600,56);ctx.fill();
  ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;

  // Title
  ctx.fillStyle='#81C784';ctx.font='bold 88px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='center';
  ctx.fillText('中午吃什么',W/2,410);
  ctx.font='100px sans-serif';ctx.fillText('🍱  🍜  🍔  🍕  🍣  🥗',W/2,570);
  ctx.fillStyle='#999';ctx.font='44px -apple-system,"PingFang SC",sans-serif';ctx.fillText('随机决定午餐的治愈小工具',W/2,690);

  // Divider
  ctx.strokeStyle='#A5D6A7';ctx.lineWidth=3;ctx.setLineDash([16,12]);
  ctx.beginPath();ctx.moveTo(190,770);ctx.lineTo(W-190,770);ctx.stroke();ctx.setLineDash([]);

  // Features
  ctx.fillStyle='#777';ctx.font='40px -apple-system,"PingFang SC",sans-serif';
  ['🎲  一键随机 · 告别选择困难','📝  自由编辑 · 定制专属菜单','🎰  老虎机动画 · 紧张又刺激'].forEach((t,i)=>ctx.fillText(t,W/2,880+i*96));

  // QR code
  const qs = 280;
  const qx = (W - qs) / 2;
  const qy = H - 400;
  ctx.fillStyle='#FFF';rr(ctx,qx-32,qy-32,qs+64,qs+64,40);ctx.fill();
  ctx.drawImage(qrImg,qx,qy,qs,qs);

  // Hint
  ctx.fillStyle='#AAA';ctx.font='28px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('扫码或长按识别 · 和朋友一起玩',W/2,H-48);

  document.getElementById('dl-btn').disabled = false;
  document.getElementById('dl-btn').textContent = '下载 PNG';
}

const qr = new Image();
qr.crossOrigin = 'anonymous';
qr.onload = () => draw(qr);
qr.src = 'https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=https://lunch-1t7.pages.dev/&margin=8';

function download() {
  const a = document.createElement('a');
  a.download = 'share-card.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
